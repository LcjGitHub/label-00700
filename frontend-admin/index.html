<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公共交通管理系统 (公交版MVP)</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- 导航栏 -->
    <nav class="navbar-header bg-gradient-to-r from-blue-700 via-blue-800 to-blue-900 text-white shadow-2xl z-50 flex-none relative overflow-hidden">
        <!-- 装饰性背景图案 -->
        <div class="absolute inset-0 opacity-10">
            <div class="absolute top-0 right-0 w-96 h-96 bg-white rounded-full -mr-48 -mt-48"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-white rounded-full -ml-32 -mb-32"></div>
        </div>
        
        <div class="max-w-7xl mx-auto px-4 md:px-6 relative z-10">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <div class="flex items-center gap-3 group cursor-pointer">
                    <div class="p-2 bg-white/10 rounded-xl backdrop-blur-sm border border-white/20 shadow-lg group-hover:bg-white/20 transition-all">
                        <span id="icon-bus-logo" class="text-white"></span>
                    </div>
                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-2xl tracking-tight">SmartBus</span>
                            <span class="text-xs bg-gradient-to-r from-blue-400 to-blue-500 px-2.5 py-1 rounded-full font-semibold shadow-md border border-blue-300/30">MVP</span>
                        </div>
                        <span class="text-xs text-blue-200 font-medium mt-0.5">公共交通管理系统</span>
                    </div>
                </div>
                
                <!-- Desktop Nav -->
                <div class="hidden md:flex items-center gap-2 bg-white/5 backdrop-blur-sm rounded-xl p-1.5 border border-white/10 shadow-inner">
                    <button data-target="page-routes" class="nav-btn px-5 py-2.5 rounded-lg text-sm font-semibold transition-all bg-white/20 text-white shadow-md hover:bg-white/30 hover:shadow-lg active:scale-95">
                        <span class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.159.69.159 1.006 0Z" />
                            </svg>
                            线路管理
                        </span>
                    </button>
                    <button data-target="page-vehicles" class="nav-btn px-5 py-2.5 rounded-lg text-sm font-semibold transition-all text-blue-100 hover:bg-white/10 hover:text-white active:scale-95">
                        <span class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
                            </svg>
                            车辆调度
                        </span>
                    </button>
                    <button data-target="page-stations" class="nav-btn px-5 py-2.5 rounded-lg text-sm font-semibold transition-all text-blue-100 hover:bg-white/10 hover:text-white active:scale-95">
                        <span class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                            </svg>
                            站点查询
                        </span>
                    </button>
                    <button data-target="page-stats" class="nav-btn px-5 py-2.5 rounded-lg text-sm font-semibold transition-all text-blue-100 hover:bg-white/10 hover:text-white active:scale-95">
                        <span class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
                            </svg>
                            数据概览
                        </span>
                    </button>
                </div>

                <!-- Mobile menu button -->
                <div class="md:hidden">
                    <button class="text-blue-100 hover:text-white hover:bg-white/10 active:bg-white/20 rounded-xl p-2.5 transition-all border border-white/20 shadow-sm" 
                            id="btn-mobile-menu"
                            aria-label="移动端菜单">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Nav -->
        <div class="md:hidden bg-gradient-to-r from-blue-900 to-blue-800 border-t border-white/10 py-3 px-4">
            <div class="flex justify-around gap-2">
                <button data-target="page-routes" class="nav-btn flex-1 text-center py-2.5 rounded-lg text-xs font-semibold bg-white/10 text-white border border-white/20 shadow-sm">线路</button>
                <button data-target="page-vehicles" class="nav-btn flex-1 text-center py-2.5 rounded-lg text-xs font-semibold text-blue-200 hover:bg-white/10 hover:text-white border border-white/10 transition-all">车辆</button>
                <button data-target="page-stations" class="nav-btn flex-1 text-center py-2.5 rounded-lg text-xs font-semibold text-blue-200 hover:bg-white/10 hover:text-white border border-white/10 transition-all">查询</button>
                <button data-target="page-stats" class="nav-btn flex-1 text-center py-2.5 rounded-lg text-xs font-semibold text-blue-200 hover:bg-white/10 hover:text-white border border-white/10 transition-all">统计</button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="flex-1 overflow-auto p-4 md:p-6 max-w-7xl mx-auto w-full relative bg-gray-50">
        
        <!-- 1. 线路列表页 -->
        <section id="page-routes" class="page-section space-y-4 bg-white border border-gray-200 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-gray-200 min-h-[72px]">
                <h2 class="text-2xl font-bold text-gray-800">线路管理</h2>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <!-- 搜索框 -->
                    <div class="relative flex-1 md:flex-none md:w-80">
                        <input type="text" id="route-search-input" placeholder="搜索线路号、起点、终点或途经站点..." 
                            class="w-full px-4 py-2.5 pl-10 rounded-lg shadow-sm border border-gray-300 hover:border-blue-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition-all bg-white">
                        <span id="icon-route-search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></span>
                        <button id="btn-clear-search" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden" style="display: none;">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <button id="btn-add-route" class="btn-primary flex items-center gap-2 whitespace-nowrap shadow-lg hover:shadow-xl">
                        <span id="icon-plus"></span> 新增线路
                    </button>
                </div>
            </div>
            
            <!-- 搜索结果提示 -->
            <div id="route-search-result" class="text-sm text-gray-500 mb-4 hidden"></div>
            
            <div id="routes-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Route Items Rendered Here -->
            </div>
        </section>

        <!-- 2. 车辆调度页 -->
        <section id="page-vehicles" class="page-section hidden space-y-4 bg-white border border-gray-200 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-gray-200 min-h-[72px]">
                <h2 class="text-2xl font-bold text-gray-800">车辆调度</h2>
                <div class="flex items-center gap-2 bg-gray-50 px-4 py-2 rounded-lg border border-gray-200">
                    <label class="text-sm font-medium text-gray-700">状态筛选:</label>
                    <div id="vehicle-filter-container" class="w-40"></div>
                </div>
            </div>
            
            <div id="vehicles-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Vehicle Cards Rendered Here -->
            </div>
        </section>

        <!-- 3. 站点查询页 -->
        <section id="page-stations" class="page-section hidden space-y-4 bg-white border border-gray-200 shadow-sm">
            <!-- 页面头部 -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-gray-200 min-h-[72px]">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">站点查询</h2>
                    <p class="text-small text-gray-500 mt-1">实时查看公交到站时间</p>
                </div>
                <div class="w-full md:w-[600px]">
                    <div class="relative">
                        <input type="text" id="station-search-input" placeholder="输入站点名称，如 '火车站'..." 
                            class="w-full px-5 py-3 pl-12 rounded-lg shadow-sm border border-gray-300 bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                        <span id="icon-search-input" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></span>
                    </div>
                </div>
            </div>

            <!-- 搜索结果 -->
            <div id="station-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-16 bg-gradient-to-br from-gray-50 to-white rounded-lg border-2 border-dashed border-gray-300 shadow-inner">
                    <div class="text-4xl mb-4">🔍</div>
                    <p class="text-lg font-medium text-gray-600 mb-2">请输入站点名称进行搜索</p>
                    <p class="text-small text-gray-500">实时查看公交到站时间</p>
                </div>
            </div>
        </section>

        <!-- 4. 基础统计页 -->
        <section id="page-stats" class="page-section hidden space-y-6 bg-white border border-gray-200 shadow-sm">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-gray-200 min-h-[72px]">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">运营数据概览</h2>
                    <p class="text-small text-gray-500 mt-1">实时统计运营数据</p>
                </div>
                <div class="w-full md:w-auto">
                    <!-- 预留操作区域，保持布局一致 -->
                </div>
            </div>
            
            <!-- 统计卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 运营线路总数卡片 -->
                <div class="stat-card-new bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl p-6 shadow-lg border-l-4 border-blue-500 border-t border-r border-b border-blue-200 hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                    <div id="stat-card-routes">
                        <!-- 内容由 JS 动态渲染 -->
                    </div>
                </div>

                <!-- 车辆总数卡片 -->
                <div class="stat-card-new bg-gradient-to-br from-amber-50 to-amber-100 rounded-xl p-6 shadow-lg border-l-4 border-amber-500 border-t border-r border-b border-amber-200 hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                    <div id="stat-card-vehicles">
                        <!-- 内容由 JS 动态渲染 -->
                    </div>
                </div>

                <!-- 今日活跃车辆卡片 -->
                <div class="stat-card-new bg-gradient-to-br from-emerald-50 to-emerald-100 rounded-xl p-6 shadow-lg border-l-4 border-emerald-500 border-t border-r border-b border-emerald-200 hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                    <div id="stat-card-active">
                        <!-- 内容由 JS 动态渲染 -->
                    </div>
                </div>
            </div>

            <!-- 热门站点榜单 -->
            <div class="bg-gradient-to-br from-gray-50 to-white rounded-xl shadow-md border-2 border-gray-200 p-6 mt-6">
                <div class="flex items-center gap-3 mb-4 pb-3 border-b border-gray-200">
                    <span id="icon-fire" class="text-red-500"></span>
                    <h3 class="text-xl font-bold text-gray-800">热门站点 TOP 3</h3>
                </div>
                <div id="stat-top-stations" class="space-y-3">
                    <!-- Top stations list -->
                </div>
            </div>
        </section>

    </main>

    <!-- Modal: 新增/编辑线路 -->
    <div id="modal-route" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 transform scale-95 transition-transform duration-300 border-2 border-gray-100" id="modal-content">
            <!-- 头部 -->
            <div class="bg-gradient-to-r from-blue-50 to-cyan-50 px-6 py-5 border-b-2 border-gray-200 rounded-t-2xl flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-blue-100 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-blue-600">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.159.69.159 1.006 0Z" />
                        </svg>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800" id="modal-title">新增线路</h3>
                </div>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-600 hover:bg-white/80 active:bg-white rounded-lg w-9 h-9 flex items-center justify-center transition-all shadow-sm" aria-label="关闭">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <!-- 表单内容 -->
            <form id="form-route" class="p-6 space-y-5 bg-gradient-to-br from-white to-gray-50">
                <input type="hidden" name="isEdit" value="false">
                <input type="hidden" name="originalId" value="">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700 flex items-center gap-1">
                            <span>线路号</span>
                            <span class="text-red-500 text-xs">*</span>
                        </label>
                        <input type="text" name="id" required maxlength="10"
                            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white hover:border-gray-300 text-sm shadow-sm" 
                            placeholder="如: 101">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700 flex items-center gap-1">
                            <span>运营时间</span>
                            <span class="text-red-500 text-xs">*</span>
                        </label>
                        <input type="text" name="time" required 
                            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white hover:border-gray-300 text-sm shadow-sm" 
                            placeholder="06:00-22:00">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700 flex items-center gap-1">
                            <span>起点站</span>
                            <span class="text-red-500 text-xs">*</span>
                        </label>
                        <input type="text" name="start" required maxlength="10"
                            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white hover:border-gray-300 text-sm shadow-sm" 
                            placeholder="请输入起点站名称">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700 flex items-center gap-1">
                            <span>终点站</span>
                            <span class="text-red-500 text-xs">*</span>
                        </label>
                        <input type="text" name="end" required maxlength="10"
                            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white hover:border-gray-300 text-sm shadow-sm" 
                            placeholder="请输入终点站名称">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700 flex items-center gap-2">
                        <span>途经站点</span>
                        <span class="text-red-500 text-xs">*</span>
                        <span class="text-xs text-gray-400 font-normal">(用逗号分隔)</span>
                    </label>
                    <textarea name="stationsStr" required rows="4" 
                        class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white hover:border-gray-300 text-sm shadow-sm resize-none" 
                        placeholder="火车站, 商业街, 医院, 公园..."></textarea>
                    <p class="text-xs text-gray-400 mt-1">多个站点请用中文或英文逗号分隔</p>
                </div>

                <!-- 按钮组 -->
                <div class="pt-4 flex gap-3 justify-end border-t-2 border-gray-100 mt-6">
                    <button type="button" id="btn-cancel-modal" 
                        class="px-5 py-2.5 text-gray-700 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 rounded-lg transition-all font-semibold text-sm shadow-sm border border-gray-200">
                        取消
                    </button>
                    <button type="submit" 
                        class="px-6 py-2.5 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 active:scale-95 text-white rounded-lg font-semibold shadow-lg transition-all text-sm">
                        保存提交
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[200] flex flex-col items-end pointer-events-none"></div>

    <script type="module" src="./main.js"></script>
</body>
</html>
